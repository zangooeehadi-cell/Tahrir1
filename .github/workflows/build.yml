name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: ["main.hadi.z"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target SmartTahrirProcessor_VST3 --parallel 2

      - name: Locate VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle was not produced." }
          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found VST3: $($plugin.FullName)"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Tahrir-Processor-Windows-x64
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
