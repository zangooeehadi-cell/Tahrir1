name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: ["main.hadi.z"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target SmartTahrirProcessor_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Tahrir-Processor-Windows-x64
          path: build/**/Smart Tahrir Processor.vst3
          if-no-files-found: error
